<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive layered 3D scene with parallax and rain effects."
    />
    <title>Depth — Interactive 3D Scene</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/app.js"></script>
    <script defer src="libs/rain.js"></script>
  </head>
  <body class="page">
    <main class="scene">
      <div class="scene__logo" aria-hidden="true"></div>
      <div class="layers__container">
        <div
          class="layers__item layers__item--background"
          aria-hidden="true"
        ></div>
        <div
          class="layers__item layers__item--mountains"
          aria-hidden="true"
        ></div>
        <div class="layers__item layers__item--content">
          <div class="hero">
            <h1 class="hero__title">
              Explore the depth <span>of 3D animation</span>
            </h1>
            <p class="hero__subtitle">Move the pointer to shift perspective</p>
            <button class="hero__button" type="button">Pause rain</button>
          </div>
        </div>
        <div class="layers__item layers__item--rain" aria-hidden="true">
          <canvas class="layers__rain"></canvas>
        </div>
        <div
          class="layers__item layers__item--foliage"
          aria-hidden="true"
        ></div>
        <div
          class="layers__item layers__item--foreground"
          aria-hidden="true"
        ></div>
      </div>
    </main>
  </body>
</html>
